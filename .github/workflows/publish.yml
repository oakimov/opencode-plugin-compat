# Publish public `@opencode-compat/*` packages via Trusted Publishing (OIDC).
#
# No long-lived npm token. Short-lived OIDC from GitHub Actions → npm.
# Provenance attestations require a **public** repo + **public** packages
# (this repo and all workspace packages are public).
#
# Requires npm CLI >= 11.5.1 and Node >= 22.14 (we use Node 24).
#
# First-time bootstrap (packages must exist before Trusted Publisher works):
#   See docs/guides/npm-publish.md → "First-time publishing".
#
# Later releases:
#   1. Bump the train version: bun scripts/bump-version.ts X.Y.Z
#   2. Commit to main, push.
#   3. Tag matching package.json: git tag vX.Y.Z && git push origin vX.Y.Z
#   4. This workflow: install → typecheck → test → build → publish (OIDC).
#
# If OIDC fails with ENEEDAUTH, check that workflow filename (publish.yml),
# repository (oakimov/opencode-plugin-compat), and each package.json
# repository.url all match the Trusted Publisher registration on npm.

name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # OIDC trusted publishing
  contents: read

jobs:
  publish:
    name: Publish public opencode-compat packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node + npm registry (OIDC)
        uses: actions/setup-node@v6
        # Node 24 → npm 11.x (trusted publishing needs npm >= 11.5.1).
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      # Same probe as ci.yml and scripts/ci-enable-userns.sh: the isolation
      # tests in ./test fail closed when unshare cannot create a namespace.
      - name: Allow user namespaces
        run: |
          set -euo pipefail
          probe() {
            unshare --user --map-root-user --mount --pid --fork --mount-proc true
          }
          if probe >/dev/null 2>&1; then
            echo "user namespaces already available"
            exit 0
          fi
          sysctl_path=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [[ -r "$sysctl_path" && "$(cat "$sysctl_path")" != "0" ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          clone_path=/proc/sys/kernel/unprivileged_userns_clone
          if [[ -r "$clone_path" && "$(cat "$clone_path")" != "1" ]]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if probe >/dev/null 2>&1; then
            echo "user namespaces enabled"
            exit 0
          fi
          echo "unshare still cannot create a user, mount, and pid namespace." >&2
          probe || true
          exit 1

      - name: Test
        run: bun test ./test

      - name: Publish (OIDC, public access)
        # Packs with Bun (rewrites workspace:* → concrete versions), then
        # npm-publishes each public tarball with OIDC + provenance.
        run: bun scripts/publish.ts --publish --oidc --skip-tests